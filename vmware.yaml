---
# ============================================================
# Playbook: vmware.yaml
# Consulta VMs no vCenter.
#
# As credenciais são injetadas pelo AAP via credencial
# "poc-claro-hashicorp-VCenter" (tipo: VMware vCenter),
# que busca os valores no Vault automaticamente.
# ============================================================
- name: Consultar VMs no vCenter
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Coletar e exibir VMs via role vmware
      ansible.builtin.include_role:
        name: vmware
