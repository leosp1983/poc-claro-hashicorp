---
# ============================================================
# Playbook: vmware.yaml
# Consulta VMs no vCenter usando credenciais do Vault (AppRole)
#
# Uso:
#   ansible-playbook vmware.yaml \
#     -e vault_role_id=<role_id> \
#     -e vault_secret_id=<secret_id>
# ============================================================
- name: Consultar VMs no vCenter via Vault AppRole
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Acesso via CyberArk ao kelvin.local
      include_role:
        name: vmware
