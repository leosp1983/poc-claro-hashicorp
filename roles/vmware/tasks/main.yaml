---
# ============================================================
# Role: vmware — tasks/main.yaml
# As credenciais do vCenter são injetadas pelo AAP via credencial
# "VMware vCenter" (poc-claro-hashicorp-VCenter), que busca os
# valores no Vault automaticamente antes de executar o playbook.
#
# Variáveis injetadas pelo AAP:
#   VMWARE_HOST     → hostname do vCenter
#   VMWARE_USER     → usuário do vCenter
#   VMWARE_PASSWORD → senha do vCenter
# ============================================================

# ------------------------------------------------------------------
# 1. Coletar informações de todas as VMs no vCenter
# ------------------------------------------------------------------
- name: Coletar informações de todas as VMs no vCenter
  community.vmware.vmware_vm_info:
    hostname: "{{ lookup('env', 'VMWARE_HOST') | default(vcenter_hostname) }}"
    username: "{{ lookup('env', 'VMWARE_USER') }}"
    password: "{{ lookup('env', 'VMWARE_PASSWORD') }}"
    validate_certs: "{{ vcenter_validate_certs }}"
  register: vm_info
  no_log: true

# ------------------------------------------------------------------
# 2. Exibir nome e status de cada VM
# ------------------------------------------------------------------
- name: Exibir Nome e Status das VMs
  ansible.builtin.debug:
    msg: "VM: {{ item.guest_name }} | Power: {{ item.power_state }} | IP: {{ item.ip_address | default('N/A') }}"
  loop: "{{ vm_info.virtual_machines }}"
  loop_control:
    label: "{{ item.guest_name }}"

# ------------------------------------------------------------------
# 3. Salvar relatório de VMs em arquivo local
# ------------------------------------------------------------------
- name: Salvar relatório de VMs em arquivo local
  ansible.builtin.copy:
    content: |
      # Relatório de VMs — {{ lookup('env', 'VMWARE_HOST') | default(vcenter_hostname) }}
      # Gerado em: {{ ansible_date_time.iso8601 }}
      {% for vm in vm_info.virtual_machines %}
      - name: {{ vm.guest_name }}
        power_state: {{ vm.power_state }}
        ip_address: {{ vm.ip_address | default('N/A') }}
        guest_os: {{ vm.guest_fullname | default('N/A') }}
        datacenter: {{ vm.datacenter | default('N/A') }}
        cluster: {{ vm.cluster | default('N/A') }}
      {% endfor %}
    dest: "/tmp/vmware_report_{{ ansible_date_time.date }}.yaml"
    mode: "0640"
  delegate_to: localhost
