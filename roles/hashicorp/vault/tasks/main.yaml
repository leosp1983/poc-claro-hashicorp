---
# ============================================================
# Role: hashicorp/vault — tasks/main.yaml
# ============================================================

- name: Instalar dependências do Vault
  ansible.builtin.package:
    name:
      - curl
      - unzip
    state: present
  tags: vault

- name: Verificar versão do Vault instalada
  ansible.builtin.command: vault version
  register: vault_installed_version
  changed_when: false
  failed_when: false
  tags: vault

- name: Exibir versão instalada
  ansible.builtin.debug:
    msg: "Vault versão instalada: {{ vault_installed_version.stdout | default('não instalado') }}"
  tags: vault

- name: Verificar status do serviço Vault
  ansible.builtin.systemd:
    name: vault
    state: started
    enabled: true
  tags: vault
