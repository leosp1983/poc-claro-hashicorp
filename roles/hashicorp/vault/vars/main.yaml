---
# ============================================================
# Role: hashicorp/vault — vars/main.yaml
# ============================================================

vault_version: "1.17.0"
vault_install_dir: "/opt/vault"
vault_config_dir: "/etc/vault.d"
vault_data_dir: "/opt/vault/data"

vault_listener_address: "0.0.0.0"
vault_listener_port: 8200
vault_cluster_port: 8201

vault_storage_backend: "raft"    # raft | consul | file
vault_raft_data_dir: "{{ vault_data_dir }}/raft"
vault_raft_node_id: "{{ inventory_hostname }}"
