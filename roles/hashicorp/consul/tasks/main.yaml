---
# ============================================================
# Role: hashicorp/consul — tasks/main.yaml
# ============================================================

- name: Instalar dependências do Consul
  ansible.builtin.package:
    name:
      - curl
      - unzip
    state: present
  tags: consul

- name: Verificar versão do Consul instalada
  ansible.builtin.command: consul version
  register: consul_installed_version
  changed_when: false
  failed_when: false
  tags: consul

- name: Exibir versão instalada
  ansible.builtin.debug:
    msg: "Consul versão instalada: {{ consul_installed_version.stdout | default('não instalado') }}"
  tags: consul

- name: Verificar status do serviço Consul
  ansible.builtin.systemd:
    name: consul
    state: started
    enabled: true
  tags: consul
