# ============================================================
# AAP Custom Credential Type — HashiCorp Vault AppRole
# ============================================================
# Como aplicar no AAP:
#   Administration → Credential Types → Add
#
# Cole o bloco "INPUT CONFIGURATION" no campo "Input Configuration"
# Cole o bloco "INJECTOR CONFIGURATION" no campo "Injector Configuration"
# ============================================================

# ---- INPUT CONFIGURATION ------------------------------------
fields:
  - id: vault_addr
    type: string
    label: Vault Server URL
    help_text: "Ex: https://poc-claro-public-vault-xxx.hashicorp.cloud:8200"

  - id: vault_namespace
    type: string
    label: Vault Namespace (Enterprise)
    help_text: "Ex: admin (deixe vazio para Vault OSS)"

  - id: vault_role_id
    type: string
    label: AppRole Role ID

  - id: vault_secret_id
    type: string
    label: AppRole Secret ID
    secret: true

  - id: vault_auth_path
    type: string
    label: Path to AppRole Auth
    help_text: "Padrão: approle"
    default: approle

required:
  - vault_addr
  - vault_role_id
  - vault_secret_id

# ---- INJECTOR CONFIGURATION ---------------------------------
extra_vars:
  vault_addr: "{{ vault_addr }}"
  vault_namespace: "{{ vault_namespace }}"
  vault_role_id: "{{ vault_role_id }}"
  vault_secret_id: "{{ vault_secret_id }}"
  vault_auth_method: "approle"
  vault_auth_path: "{{ vault_auth_path }}"
  vault_validate_certs: false
